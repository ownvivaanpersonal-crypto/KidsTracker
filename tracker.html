<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore Tracker (Google Sheets Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google API Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoad()"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Header / Scoreboard -->
        <header class="flex flex-col sm:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl shadow-lg mb-6 border border-slate-700 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-indigo-400">My Reward & Point Tracker</h1>
                <p class="text-slate-400 text-sm">Data synced live with Google Sheets</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="auth-btn" onclick="handleAuthClick()" class="px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold transition shadow-lg">
                    Login to Google Sync
                </button>
                <div class="bg-indigo-600 px-6 py-3 rounded-xl text-center shadow-md flex-1 sm:flex-initial">
                    <span class="block text-xs uppercase tracking-wider font-semibold text-indigo-200">Total Points Carryover</span>
                    <span id="total-points" class="text-3xl font-extrabold">0 pts</span>
                </div>
            </div>
        </header>

        <!-- Day Selector -->
        <div class="mb-4">
            <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Select Day:</span>
            <div id="day-selector" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>
        </div>

        <!-- View Selector Tabs -->
        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="switchTab('tasks')" id="btn-tasks" class="px-5 py-2.5 rounded-xl font-medium transition shadow bg-indigo-600 text-white">Daily Routine</button>
            <button onclick="switchTab('prizes')" id="btn-prizes" class="px-5 py-2.5 rounded-xl font-medium transition shadow bg-slate-800 text-slate-300">Prize Store 🎁</button>
        </div>

        <div id="tasks-container" class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
            <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <div id="prizes-container" class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl hidden">
            <div id="prize-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🛑 PASTE YOUR GOOGLE CREDENTIALS HERE 🛑
        // ==========================================
        const CLIENT_ID = '773316164141-odat1kef60rol219jis4n9r5hb9io1tm.apps.googleusercontent.com';
        const API_KEY = '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';
        const SPREADSHEET_ID = '1lUVO-Lkd67vIfaUhVMFWa6_oeTVyb9XcUaQMTuClWi0';
        // ==========================================

        const DISCOVERY_DOC = 'https://sheets.googleapis.com/$discovery/rest?version=v4';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

        let tokenClient;
        let gapiInited = false;
        let isAuthenticated = false;
        
        let points = 0;
        let trackerData = {}; // Stores all checkmarks locally before syncing

        // --- Google API Initialization ---
        function gapiLoad() {
            gapi.load('client', initializeGapiClient);
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error !== undefined) {
                        throw (tokenResponse);
                    }
                    isAuthenticated = true;
                    document.getElementById('auth-btn').innerText = "Syncing Active ✅";
                    document.getElementById('auth-btn').className = "px-4 py-3 rounded-xl bg-emerald-600 text-white font-bold transition shadow-lg cursor-default";
                    loadFromGoogleSheets();
                },
            });
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
        }

        function handleAuthClick() {
            if (gapiInited) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            }
        }

        // --- Fetch Data from Sheets ---
        async function loadFromGoogleSheets() {
            try {
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: SPREADSHEET_ID,
                    range: 'Sheet1!A:B',
                });
                
                const rows = response.result.values;
                trackerData = {};
                
                if (rows && rows.length > 0) {
                    rows.forEach(row => {
                        if (row.length === 2) {
                            if (row[0] === 'user_points') {
                                points = parseInt(row[1]) || 0;
                            } else {
                                trackerData[row[0]] = row[1];
                            }
                        }
                    });
                }
                
                // Weekly reset check after load
                checkWeeklyReset();
                updateUI();
            } catch (err) {
                console.error("Error reading sheet:", err);
            }
        }

        // --- Save Data to Sheets ---
        async function saveToGoogleSheets() {
            if (!isAuthenticated) return; // Only save if logged in

            const values = [['user_points', points.toString()]];
            for (const [key, value] of Object.entries(trackerData)) {
                values.push([key, value.toString()]);
            }

            const body = { values: values };
            try {
                // Clear existing data first
                await gapi.client.sheets.spreadsheets.values.clear({
                    spreadsheetId: SPREADSHEET_ID,
                    range: 'Sheet1!A:B',
                });
                
                // Write new data
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId: SPREADSHEET_ID,
                    range: 'Sheet1!A:B',
                    valueInputOption: 'RAW',
                    resource: body,
                });
            } catch (err) {
                console.error("Error saving to sheet:", err);
            }
        }

        // --- Core App Variables ---
        const daysOfWeek = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        const todayIndex = (new Date().getDay() + 6) % 7; 
        let currentDay = daysOfWeek[todayIndex];
        let currentTab = 'tasks';

        const weekdayTasks = [
            "Wake up by 6:45 am", "Brush your teeth", "Potty seat clean", 
            "Clean bathroom after bath", "Get ready by 7:30 am & breakfast by 7:45 am", 
            "Wearing socks by yourself", "Put shoes back in shoe rack", "Keep dress back after school within 15 mins", 
            "Go to Telugu tuition without reminding", "Go to karate class without reminding", 
            "Finish Telugu tuition directly after class", "Back home by 7 pm / Karate by 7:30 pm", 
            "Study for half an hour", "Hindi reading/writing 15 mins", "Bag Setup", "Sleep by 9:30 pm"
        ];

        const weekendTasks = [
            "Wake up by 8 am", "Brush your teeth", "Potty seat clean", 
            "Clean bathroom & laundry bag", "Cycling half an hour", "Bath before 12 pm", 
            "Takeout clothes from swimming bag in 15 mins", "Maths 20 sums", "Writing on a topic in Eng/Hindi", 
            "Back home after play by 7 pm", "Study for half an hour", "Hindi reading/writing 15 mins", 
            "Bag Setup", "Sleep by 9:30 pm"
        ];

        const prizes = [
            { name: "TV Half an Hour", cost: 30 },
            { name: "Chips", cost: 20 },
            { name: "Chocolate", cost: 20 },
            { name: "Sweet", cost: 20 },
            { name: "Golgappe", cost: 20 },
            { name: "Movie (Once a week - 2.5 hr)", cost: 150 }
        ];

        function isStudyTask(taskName) {
            return ["study", "hindi reading/writing", "maths 20 sums", "writing on a topic"].some(k => taskName.toLowerCase().includes(k));
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return d.getUTCFullYear() + "-W" + Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        function checkWeeklyReset() {
            const currentWeek = getWeekNumber(new Date());
            const lastSavedWeek = trackerData['last_active_week'];

            if (lastSavedWeek && lastSavedWeek !== currentWeek) {
                daysOfWeek.forEach(day => {
                    const tasks = (day === "Sat" || day === "Sun") ? weekendTasks : weekdayTasks;
                    tasks.forEach((_, index) => delete trackerData[`task_${day}_${index}`]);
                });
                saveToGoogleSheets();
            }
            trackerData['last_active_week'] = currentWeek;
        }

        function switchTab(tab) {
            currentTab = tab;
            updateUI();
        }

        function selectDay(day) {
            currentDay = day;
            updateUI();
        }

        function updateUI() {
            document.getElementById('total-points').innerText = points + ' pts';
            
            // Build Day Selector
            const dayContainer = document.getElementById('day-selector');
            dayContainer.innerHTML = '';
            daysOfWeek.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `py-2 rounded-xl text-xs font-bold transition ${day === currentDay ? 'bg-indigo-500 text-white shadow-md scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`;
                btn.innerText = day;
                btn.onclick = () => selectDay(day);
                dayContainer.appendChild(btn);
            });

            if (currentTab === 'prizes') {
                document.getElementById('tasks-container').classList.add('hidden');
                document.getElementById('prizes-container').classList.remove('hidden');
                renderPrizes();
            } else {
                document.getElementById('tasks-container').classList.remove('hidden');
                document.getElementById('prizes-container').classList.add('hidden');
                renderTasks();
            }
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const isWeekend = currentDay === "Sat" || currentDay === "Sun";
            const tasks = isWeekend ? weekendTasks : weekdayTasks;
            listEl.innerHTML = '';

            tasks.forEach((taskName, index) => {
                const storageKey = `task_${currentDay}_${index}`;
                const card = document.createElement('div');
                const isStudy = isStudyTask(taskName);

                if (isStudy) {
                    let count = parseInt(trackerData[storageKey]) || 0;
                    card.className = `flex items-center justify-between p-4 rounded-xl border transition ${count > 0 ? 'bg-indigo-950/40 border-indigo-500/50' : 'bg-slate-900/50 border-slate-700'}`;
                    card.innerHTML = `
                        <div class="flex flex-col"><span class="text-sm font-medium pr-2">${taskName}</span><span class="text-xs text-indigo-300">Unlimited Multiplier 📚</span></div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${count > 0 ? 'bg-indigo-500/30 text-indigo-300' : 'bg-slate-800 text-slate-400'}">+${count * 5} pts</span>
                            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
                                <button onclick="adjustStudyPoints('${storageKey}', -1)" class="w-7 h-7 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-sm">-</button>
                                <span class="w-6 text-center text-sm font-bold">${count}</span>
                                <button onclick="adjustStudyPoints('${storageKey}', 1)" class="w-7 h-7 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">+</button>
                            </div>
                        </div>`;
                } else {
                    const isCompleted = trackerData[storageKey] === 'true';
                    card.className = `flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${isCompleted ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-900/50 border-slate-700 hover:border-slate-500'}`;
                    card.onclick = () => {
                        const newState = !(trackerData[storageKey] === 'true');
                        trackerData[storageKey] = newState.toString();
                        points += newState ? 5 : -5;
                        updateUI();
                        saveToGoogleSheets(); // Auto-save on click
                    };
                    card.innerHTML = `
                        <span class="text-sm font-medium pr-4">${taskName}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isCompleted ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">+5 pts</span>
                            <div class="w-6 h-6 rounded-lg border flex items-center justify-center ${isCompleted ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-bold' : 'border-slate-600'}">${isCompleted ? '✓' : ''}</div>
                        </div>`;
                }
                listEl.appendChild(card);
            });
        }

        function adjustStudyPoints(storageKey, change) {
            let count = parseInt(trackerData[storageKey]) || 0;
            if (count + change < 0) return;
            count += change;
            trackerData[storageKey] = count.toString();
            points += change * 5;
            updateUI();
            saveToGoogleSheets(); // Auto-save
        }

        function renderPrizes() {
            const listEl = document.getElementById('prize-list');
            listEl.innerHTML = '';
            prizes.forEach(prize => {
                const canAfford = points >= prize.cost;
                const card = document.createElement('div');
                card.className = "bg-slate-900/60 p-5 rounded-xl border border-slate-700 flex flex-col justify-between";
                card.innerHTML = `
                    <div><h3 class="font-bold text-base mb-1">${prize.name}</h3><span class="text-amber-400 font-semibold text-sm">${prize.cost} Points Deduction</span></div>
                    <button onclick="redeemPrize(${prize.cost}, '${prize.name}')" class="mt-4 w-full py-2.5 rounded-xl font-medium text-sm transition ${canAfford ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-lg cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}">${canAfford ? 'Redeem Prize' : 'Not Enough Points'}</button>`;
                listEl.appendChild(card);
            });
        }

        function redeemPrize(cost, name) {
            if (points >= cost) {
                points -= cost;
                alert(`Successfully redeemed: ${name}! 🎉`);
                updateUI();
                saveToGoogleSheets(); // Auto-save
            }
        }

        updateUI();
    </script>
</body>
</html>
