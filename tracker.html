<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore & Point Tracker (7-Day Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Header / Scoreboard -->
        <header class="flex flex-col sm:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl shadow-lg mb-6 border border-slate-700 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-indigo-400">My Reward & Point Tracker</h1>
                <p class="text-slate-400 text-sm">Check off tasks, stack unlimited study points, and redeem rewards!</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button onclick="manualResetWeek()" class="px-3 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold transition" title="Force reset tasks for a new week">
                    Reset Checklist 🔄
                </button>
                <div class="bg-indigo-600 px-6 py-3 rounded-xl text-center shadow-md flex-1 sm:flex-initial">
                    <span class="block text-xs uppercase tracking-wider font-semibold text-indigo-200">Total Points Carryover</span>
                    <span id="total-points" class="text-3xl font-extrabold">0 pts</span>
                </div>
            </div>
        </header>

        <!-- Day Selector -->
        <div class="mb-4">
            <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Select Day:</span>
            <div id="day-selector" class="grid grid-cols-7 gap-1.5 sm:gap-2">
                <!-- Dynamically Injected Day Buttons -->
            </div>
        </div>

        <!-- View Selector Tabs -->
        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="switchTab('tasks')" id="btn-tasks" class="px-5 py-2.5 rounded-xl font-medium transition shadow bg-indigo-600 text-white">
                Daily Routine Checklist
            </button>
            <button onclick="switchTab('prizes')" id="btn-prizes" class="px-5 py-2.5 rounded-xl font-medium transition shadow bg-slate-800 text-slate-300">
                Prize Store 🎁
            </button>
        </div>

        <!-- Task Container -->
        <div id="tasks-container" class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 id="task-title" class="text-lg font-semibold text-indigo-300 capitalize">Tasks (+5 pts each)</h2>
                <span id="routine-tag" class="text-xs px-3 py-1 rounded-full bg-slate-700 font-medium text-slate-300">Weekday Routine</span>
            </div>
            <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Dynamically injected tasks -->
            </div>
        </div>

        <!-- Prize Container -->
        <div id="prizes-container" class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl hidden">
            <h2 class="text-lg font-semibold mb-4 text-amber-300">Prize Redemption Store</h2>
            <div id="prize-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Dynamically injected prizes -->
            </div>
        </div>
    </div>

    <script>
        let points = parseInt(localStorage.getItem('user_points')) || 0;

        const daysOfWeek = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        
        // Auto-detect today's day of week
        const todayIndex = (new Date().getDay() + 6) % 7; 
        let currentDay = daysOfWeek[todayIndex];
        let currentTab = 'tasks';

        const weekdayTasks = [
            "Wake up by 6:45 am", "Brush your teeth", "Potty seat clean", 
            "Clean bathroom after bath (laundry & floor)", "Get ready by 7:30 am & breakfast by 7:45 am", 
            "Wearing socks by yourself", "Put shoes back in shoe rack", "Keep dress back after school within 15 mins", 
            "Go to Telugu tuition without reminding", "Go to karate class without reminding", 
            "Finish Telugu tuition directly after class", "Back home by 7 pm / Karate by 7:30 pm", 
            "Study for half an hour", "Hindi reading/writing 15 mins", "Bag Setup", "Sleep by 9:30 pm", "Follow the checklist"
        ];

        const weekendTasks = [
            "Wake up by 8 am / for swimming class", "Brush your teeth", "Potty seat clean", 
            "Clean bathroom & laundry bag", "Cycling half an hour", "Bath before 12 pm", 
            "Takeout clothes from swimming bag in 15 mins", "Maths 20 sums", "Writing on a topic in Eng/Hindi", 
            "Back home after play by 7 pm", "Study for half an hour", "Hindi reading/writing 15 mins", 
            "Bag Setup", "Sleep by 9:30 pm", "Follow the checklist"
        ];

        const prizes = [
            { name: "TV Half an Hour", cost: 30 },
            { name: "Chips (Once a Month)", cost: 20 },
            { name: "Chocolate (Once a Month)", cost: 20 },
            { name: "Sweet (Once a Month)", cost: 20 },
            { name: "Golgappe (Once a Month)", cost: 20 },
            { name: "Movie (Once a week - 2.5 hr)", cost: 150 }
        ];

        // Identify study tasks that can be clicked unlimited times
        function isStudyTask(taskName) {
            const studyKeywords = ["study", "hindi reading/writing", "maths 20 sums", "writing on a topic"];
            return studyKeywords.some(keyword => taskName.toLowerCase().includes(keyword));
        }

        // --- WEEKLY AUTO-RESET LOGIC ---
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return d.getUTCFullYear() + "-W" + weekNo;
        }

        function checkWeeklyReset() {
            const currentWeek = getWeekNumber(new Date());
            const lastSavedWeek = localStorage.getItem('last_active_week');

            if (lastSavedWeek && lastSavedWeek !== currentWeek) {
                clearAllCheckmarks();
            }
            localStorage.setItem('last_active_week', currentWeek);
        }

        function clearAllCheckmarks() {
            daysOfWeek.forEach(day => {
                const tasks = isWeekend(day) ? weekendTasks : weekdayTasks;
                tasks.forEach((_, index) => {
                    localStorage.removeItem(`task_${day}_${index}`);
                });
            });
        }

        function isWeekend(day) {
            return day === "Sat" || day === "Sun";
        }

        function renderDaySelector() {
            const container = document.getElementById('day-selector');
            container.innerHTML = '';
            
            daysOfWeek.forEach(day => {
                const btn = document.createElement('button');
                const active = day === currentDay;
                btn.className = `py-2 rounded-xl text-xs font-bold transition ${active ? 'bg-indigo-500 text-white shadow-md scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`;
                btn.innerText = day;
                btn.onclick = () => selectDay(day);
                container.appendChild(btn);
            });
        }

        function selectDay(day) {
            currentDay = day;
            renderDaySelector();
            updateUI();
        }

        function updateUI() {
            document.getElementById('total-points').innerText = points + ' pts';
            localStorage.setItem('user_points', points);

            if (currentTab === 'prizes') {
                document.getElementById('tasks-container').classList.add('hidden');
                document.getElementById('prizes-container').classList.remove('hidden');
                renderPrizes();
            } else {
                document.getElementById('tasks-container').classList.remove('hidden');
                document.getElementById('prizes-container').classList.add('hidden');
                renderTasks();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btn-tasks').className = tab === 'tasks' ? 'px-5 py-2.5 rounded-xl font-medium transition shadow bg-indigo-600 text-white' : 'px-5 py-2.5 rounded-xl font-medium transition shadow bg-slate-800 text-slate-300';
            document.getElementById('btn-prizes').className = tab === 'prizes' ? 'px-5 py-2.5 rounded-xl font-medium transition shadow bg-amber-600 text-white' : 'px-5 py-2.5 rounded-xl font-medium transition shadow bg-slate-800 text-slate-300';
            updateUI();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            const titleEl = document.getElementById('task-title');
            const routineTagEl = document.getElementById('routine-tag');
            
            const weekend = isWeekend(currentDay);
            const tasks = weekend ? weekendTasks : weekdayTasks;

            titleEl.innerText = `${currentDay}'s Checklist`;
            routineTagEl.innerText = weekend ? "Weekend Routine" : "Weekday Routine";
            routineTagEl.className = `text-xs px-3 py-1 rounded-full font-medium ${weekend ? 'bg-amber-500/20 text-amber-300' : 'bg-indigo-500/20 text-indigo-300'}`;

            listEl.innerHTML = '';

            tasks.forEach((taskName, index) => {
                const storageKey = `task_${currentDay}_${index}`;
                const card = document.createElement('div');
                const isStudy = isStudyTask(taskName);

                if (isStudy) {
                    // Counter logic for study tasks
                    let count = parseInt(localStorage.getItem(storageKey)) || 0;

                    card.className = `flex items-center justify-between p-4 rounded-xl border transition ${count > 0 ? 'bg-indigo-950/40 border-indigo-500/50' : 'bg-slate-900/50 border-slate-700'}`;
                    card.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-sm font-medium pr-2">${taskName}</span>
                            <span class="text-xs text-indigo-300">Unlimited Multiplier 📚</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${count > 0 ? 'bg-indigo-500/30 text-indigo-300' : 'bg-slate-800 text-slate-400'}">+${count * 5} pts</span>
                            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
                                <button onclick="adjustStudyPoints('${storageKey}', -1)" class="w-7 h-7 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-sm">-</button>
                                <span class="w-6 text-center text-sm font-bold">${count}</span>
                                <button onclick="adjustStudyPoints('${storageKey}', 1)" class="w-7 h-7 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm">+</button>
                            </div>
                        </div>
                    `;
                } else {
                    // Regular single checkbox tasks
                    const isCompleted = localStorage.getItem(storageKey) === 'true';

                    card.className = `flex items-center justify-between p-4 rounded-xl border cursor-pointer transition ${isCompleted ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-slate-900/50 border-slate-700 hover:border-slate-500'}`;
                    card.onclick = () => {
                        const currentState = localStorage.getItem(storageKey) === 'true';
                        localStorage.setItem(storageKey, !currentState);
                        points += !currentState ? 5 : -5;
                        updateUI();
                    };

                    card.innerHTML = `
                        <span class="text-sm font-medium pr-4">${taskName}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isCompleted ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">+5 pts</span>
                            <div class="w-6 h-6 rounded-lg border flex items-center justify-center ${isCompleted ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-bold' : 'border-slate-600'}">
                                ${isCompleted ? '✓' : ''}
                            </div>
                        </div>
                    `;
                }

                listEl.appendChild(card);
            });
        }

        function adjustStudyPoints(storageKey, change) {
            let count = parseInt(localStorage.getItem(storageKey)) || 0;
            if (count + change < 0) return; // Don't go below 0

            count += change;
            localStorage.setItem(storageKey, count);
            points += change * 5;
            updateUI();
        }

        function renderPrizes() {
            const listEl = document.getElementById('prize-list');
            listEl.innerHTML = '';

            prizes.forEach(prize => {
                const canAfford = points >= prize.cost;
                const card = document.createElement('div');
                card.className = "bg-slate-900/60 p-5 rounded-xl border border-slate-700 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-base mb-1">${prize.name}</h3>
                        <span class="text-amber-400 font-semibold text-sm">${prize.cost} Points Deduction</span>
                    </div>
                    <button onclick="redeemPrize(${prize.cost}, '${prize.name}')" class="mt-4 w-full py-2.5 rounded-xl font-medium text-sm transition ${canAfford ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-lg cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}">
                        ${canAfford ? 'Redeem Prize' : 'Not Enough Points'}
                    </button>
                `;
                listEl.appendChild(card);
            });
        }

        function redeemPrize(cost, name) {
            if (points >= cost) {
                points -= cost;
                alert(`Successfully redeemed: ${name}! 🎉`);
                updateUI();
            }
        }

        function manualResetWeek() {
            if (confirm("Reset all checkmarks for the week? (Note: Your points total will stay untouched!)")) {
                clearAllCheckmarks();
                updateUI();
            }
        }

        // Initialize App
        checkWeeklyReset();
        renderDaySelector();
        updateUI();
    </script>
</body>
</html>
